apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: taskflow
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://taskflow-prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-grafana
  namespace: taskflow
  labels:
    app: taskflow-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-grafana
  template:
    metadata:
      labels:
        app: taskflow-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: grafana-datasources-vol
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: grafana-datasources-vol
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-grafana
  namespace: taskflow
  labels:
    app: taskflow-grafana
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
      name: http
  selector:
    app: taskflow-grafana
