apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: taskflow
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'taskflow-server'
        metrics_path: '/metrics'
        scrape_interval: 5s
        static_configs:
          - targets: ['taskflow-server:5000']
            labels:
              app: 'taskflow-backend'
              env: 'kubernetes'

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-prometheus
  namespace: taskflow
  labels:
    app: taskflow-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-prometheus
  template:
    metadata:
      labels:
        app: taskflow-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-prometheus
  namespace: taskflow
  labels:
    app: taskflow-prometheus
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      name: web
  selector:
    app: taskflow-prometheus
