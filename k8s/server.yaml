apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-server
  namespace: taskflow
  labels:
    app: taskflow-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-server
  template:
    metadata:
      labels:
        app: taskflow-server
    spec:
      containers:
        - name: server
          image: taskflow-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: taskflow-config
            - secretRef:
                name: taskflow-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-server
  namespace: taskflow
  labels:
    app: taskflow-server
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: taskflow-server
