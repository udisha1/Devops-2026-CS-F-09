apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
  namespace: taskflow
type: Opaque
stringData:
  # Option A: In-cluster MongoDB service (default)
  MONGO_URI: "mongodb://taskflow-mongodb:27017/taskflow"
  # Option B: MongoDB Atlas URI (uncomment and replace if using Atlas)
  # MONGO_URI: "mongodb+srv://<username>:<password>@cluster0.txwcyic.mongodb.net/taskflow?retryWrites=true&w=majority"
  
  JWT_SECRET: "taskflow_jwt_secret_token_2026_key_99"
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY_HERE"
