apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-client
  namespace: taskflow
  labels:
    app: taskflow-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-client
  template:
    metadata:
      labels:
        app: taskflow-client
    spec:
      containers:
        - name: client
          image: taskflow-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: BACKEND_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-client
  namespace: taskflow
  labels:
    app: taskflow-client
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: taskflow-client
